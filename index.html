<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title> Dashboard</title><style>
:root{color-scheme:light;--bg:#fff6f8;--card:#fff;--panel:#fffaf0;--text:#292f3d;--muted:#697384;--border:#ece4e9;--pink:#ffe0ec;--blue:#e0f5fa;--yellow:#fff1c3;--shadow:0 10px 30px #b76f8c16}
*{box-sizing:border-box}html{background:var(--bg);-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:radial-gradient(ellipse at top left,#ffe4ee88,transparent 45%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;line-height:1.45}.app{width:min(100%,540px);margin:auto}.topbar{display:flex;flex-direction:column;gap:18px;margin-bottom:18px}.clock{font-size:clamp(46px,14vw,62px);line-height:1;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums}.date{margin-top:9px;font-size:15px;color:#bb5578;font-weight:650}.actions{display:flex;gap:10px;width:100%}.button{flex:1;min-height:48px;border:1px solid var(--border);border-radius:16px;padding:12px 16px;background:var(--card);color:var(--text);font:700 16px -apple-system,BlinkMacSystemFont,sans-serif;box-shadow:var(--shadow);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.button:active{transform:scale(.98)}.button:disabled{opacity:.65;cursor:wait}.button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #299e81;outline-offset:3px}.primary{background:#6be1bc;color:#083d30;border-color:transparent}.mainGrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}.card,.api{min-width:0;background:var(--card);border:1px solid var(--border);border-radius:26px;padding:20px;box-shadow:var(--shadow)}.weather{background:linear-gradient(145deg,var(--card),#fff3d8)}h2{margin:0 0 14px;font-size:19px;line-height:1.4;letter-spacing:-.3px}.weatherMain{min-height:132px;display:flex;justify-content:space-between;align-items:center;gap:12px}.weatherMain>div:first-child{min-width:0}.temp{font-size:82px;color:#bf7909;font-weight:800;line-height:1;letter-spacing:-4px;font-variant-numeric:tabular-nums}.cloud{font-size:64px;flex-shrink:0}.muted,.status,small{color:var(--muted)}#weatherText{margin-top:8px;font-size:12px;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.stat{padding:12px 10px;border-radius:15px;background:var(--blue);font-size:13px;font-weight:700}.pink{background:var(--pink)}.weatherDetails{display:grid;gap:9px;margin-top:9px}.detail{padding:11px 13px;border-radius:14px;background:var(--yellow);font-size:14px;font-weight:650}.forecastTitle{margin-top:24px}.forecastScroll{display:grid;grid-auto-flow:column;grid-auto-columns:116px;gap:9px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory;scrollbar-width:thin}.day{scroll-snap-align:start;border:1px solid var(--border);border-radius:18px;padding:13px 8px;text-align:center;background:var(--panel)}.dayName{font-size:14px;font-weight:750}.dayIcon{font-size:36px;line-height:1.5;margin:6px 0}.dayTemp{font-size:14px;font-weight:750;white-space:nowrap}.dayRain{font-size:12px;color:#27718b;margin-top:6px}.rows{display:grid;gap:12px}.direction,.kmb{border:1px solid var(--border);border-radius:18px;padding:0 13px;overflow:hidden}.directionTitle,.kmbTitle{padding:13px 0;font-size:16px;font-weight:750;line-height:1.5}.row,.kmbRow{min-height:72px;border-top:1px solid var(--border);padding:12px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.row strong,.kmbRow strong{display:block;font-size:14px;line-height:1.65}.row small,.kmbRow small{display:block;font-size:11px;overflow-wrap:anywhere;margin-top:4px}.badge,.kmbBadge{display:inline-block;background:#cd2438;color:white;border-radius:7px;padding:3px 6px;margin-right:5px;font-size:11px;white-space:nowrap}.kmbBadge{background:#16727d}.arrival{color:#087f59;font-size:18px;font-weight:800;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.direction>.muted,#kmbRows>.muted{padding:10px 0;font-size:14px}.kmb{margin-top:18px}.status{font-size:12px;line-height:1.5;padding-top:10px;overflow-wrap:anywhere}.api{margin-top:16px;padding:16px 20px}.api summary{min-height:32px;font-size:16px;font-weight:700;cursor:pointer;padding:4px 0}.form{display:grid;gap:14px;margin-top:16px}.form label{font-size:14px;font-weight:650}.form input,.form select{width:100%;min-height:48px;margin-top:7px;padding:12px;border:1px solid var(--border);border-radius:12px;font:inherit;font-size:16px;background:var(--card);color:var(--text)}.full{grid-column:1/-1}
body.dark{color-scheme:dark;--bg:#141923;--card:#232a38;--panel:#2b3343;--text:#f4f6fa;--muted:#b8c2d1;--border:#414c60;--blue:#204753;--pink:#503047;--yellow:#51452a;--shadow:0 10px 30px #0003;background:var(--bg)}body.dark .weather{background:linear-gradient(145deg,#232a38,#3c3426)}body.dark .temp{color:#ffc862}body.dark .date{color:#ffa4c4}body.dark .arrival{color:#6ce3b6}body.dark .dayRain{color:#a0d9ee}
@media(min-width:850px){.app{width:min(100%,1100px)}.topbar{flex-direction:row;align-items:center}.topbar .actions{width:260px}.mainGrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.weatherDetails{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr 1fr}}
@media(max-width:360px){body{padding-left:12px;padding-right:12px}.card{padding:16px}.temp{font-size:70px}.cloud{font-size:52px}.arrival{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style><meta name="apple-mobile-web-app-title" content="香港 Dashboard"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#fff6f8"><meta name="format-detection" content="telephone=no"></head><body><div class="app"><header class="topbar"><div><div class="clock" id="clock"></div><div class="date" id="date"></div></div><div class="actions"><button class="button" id="theme">🌙 深色</button><button class="button primary" id="update">🔄 更新</button></div></header><main class="mainGrid"><section class="card weather"><h2>🌤 即時天氣</h2><div class="weatherMain"><div><div class="temp" id="temp">--°</div><div class="muted" id="weatherText">讀取中…</div></div><div class="cloud">⛅</div></div><div class="stats"><div class="stat">💧 濕度 <span id="humidity">--%</span></div><div class="stat pink">☔ 降雨量 <span id="rain">--</span></div></div><div class="weatherDetails"><div class="detail uv">☀️ 紫外線：<span id="uvValue">--</span></div><div class="detail uv">⚠️ 紫外線級別：<span id="uvDesc">--</span></div></div><h2 class="forecastTitle">📅 四天天氣</h2><div class="forecastScroll" id="forecast"><div class="muted">載入中…</div></div></section><section class="card mtr"><h2>🚇 港鐵：朗屏站</h2><div class="rows" id="mtrRows"><div class="direction"><div class="directionTitle">⬆️ 往屯門</div><div class="muted">載入中…</div></div><div class="direction"><div class="directionTitle">⬇️ 往烏溪沙</div><div class="muted">載入中…</div></div></div><div class="status" id="mtrStatus"></div><div class="kmb"><div class="kmbTitle">🚌 九巴 8：何文田站（KC305）往九龍站</div><div id="kmbRows"><div class="muted">載入中…</div></div><div class="status" id="kmbStatus"></div></div></section></main><details class="api"><summary>🔌 API 設定</summary><div class="form"><label class="full">即時天氣 API<input id="weatherUrl" value="https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc"></label><label class="full">天氣預報 API<input id="forecastUrl" value="https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc"></label><label>顯示班次數量<input id="trainCount" value="3" type="number" min="1" max="4"></label><label>更新間隔<select id="interval"><option value="0">手動</option><option value="10000">每 10 秒</option><option value="60000">每 1 分鐘</option></select></label></div><div class="actions" style="margin-top:14px"><button class="button primary" id="save">儲存並更新</button></div></details></div>
<script>
const $=id=>document.getElementById(id);let timer;function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('zh-HK',{hour12:false});$('date').textContent=d.toLocaleDateString('zh-HK',{year:'numeric',month:'long',day:'numeric',weekday:'long'})+' 🌸'}setInterval(tick,1000);tick();function first(a,n){return Array.isArray(a)?a.find(x=>n.includes(x.place))||a[0]:null}function renderNow(d){const t=first(d.temperature?.data,['香港天文台','京士柏']),h=first(d.humidity?.data,['香港天文台']),r=first(d.rainfall?.data,['中西區','大埔','沙田']),uv=first(d.uvindex?.data,['京士柏','香港天文台','黃竹坑']);if(t)$('temp').textContent=t.value+'°';if(h)$('humidity').textContent=h.value+'%';if(r)$('rain').textContent=r.max+' mm';$('uvValue').textContent=uv?.value??'暫無資料';$('uvDesc').textContent=uv?.desc??'夜間或未提供';$('weatherText').textContent='天文台更新：'+(d.updateTime||'')}function icon(i){i=Number(i);if([50,51,52].includes(i))return '☀️';if([53,54,60,61,62,63].includes(i))return '☁️';if([64,65].includes(i))return '🌧️';if(i===90)return '🌡️';if(i===91)return '❄️';return '🌤️'}function forecastLabel(s){s=String(s||'');return /^\d{8}$/.test(s)?Number(s.slice(4,6))+'月'+Number(s.slice(6))+'日':s||'預報'}function renderForecast(d){const a=d.weatherForecast||d.forecast||d.data||[];$('forecast').innerHTML=a.slice(0,4).map((x,i)=>`<div class="day"><div class="dayName">${forecastLabel(x.forecastDate||x.date)}</div><div class="dayIcon">${icon(x.ForecastIcon||x.forecastIcon||x.icon||0)}</div><div class="dayTemp">${x.forecastMintemp?.value??x.minTemp??'--'}° - ${x.forecastMaxtemp?.value??x.maxTemp??'--'}°</div><div class="dayRain">☔ ${x.PSR||x.psr||'--'}</div></div>`).join('')}function norm(v){if(Array.isArray(v))return v;if(v&&typeof v==='object')return Object.values(v).flatMap(x=>Array.isArray(x)?x:[]);return[]}function source(d){let s=d.data;if(s?.['TML-LOP'])s=s['TML-LOP'];if(s?.TML)s=s.TML;return s||{}}function mins(t){if(!t)return'--';const n=Math.round((new Date(String(t).replace(' ','T')+'+08:00')-Date.now())/60000);return n<=0?'即將到站':n+' 分鐘'}function direction(title,icon,a){const c=Math.max(1,Math.min(4,Number($('trainCount').value)||3));return `<div class="direction"><div class="directionTitle">${icon} ${title}</div>${a.slice(0,c).map(x=>`<div class="row"><div><strong><span class="badge">MTR</span>${x.dest||x.destination||'屯馬綫列車'}</strong><small>預定 ${x.time||''}</small></div><div class="arrival">${x.time?mins(x.time):'--'}</div></div>`).join('')||'<div class="muted">目前沒有列車資料</div>'}</div>`}function renderMtr(d){const s=source(d);$('mtrRows').innerHTML=direction('往屯門','⬆️',norm(s.UP))+direction('往烏溪沙','⬇️',norm(s.DOWN))}function kmbMinutes(eta){if(!eta)return '--';const n=Math.round((new Date(eta)-Date.now())/60000);return n<=0?'即將到站':n+' 分鐘'}async function updateKmb(){try{const url='https://data.etabus.gov.hk/v1/transport/kmb/eta/BC3B37FDEE7EE51B/8/1';const d=await get(url);const a=(d.data||[]).filter(x=>x.eta).slice(0,3);$('kmbRows').innerHTML=a.length?a.map(x=>`<div class="kmbRow"><div><strong><span class="kmbBadge">KMB 8</span>${x.dest_tc||'九龍站'}</strong><small>何文田站（KC305）${x.rmk_tc?'・'+x.rmk_tc:''}</small></div><div class="arrival">${kmbMinutes(x.eta)}</div></div>`).join(''):'<div class="muted">暫時沒有 8 號即時到站資料</div>';$('kmbStatus').textContent='九巴更新：'+new Date().toLocaleTimeString('zh-HK',{hour12:false})}catch(e){$('kmbRows').innerHTML='<div class="muted">九巴資料暫時無法取得</div>';$('kmbStatus').textContent='KMB 8 更新失敗：'+e.message}}let updating=false;
async function get(u){const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(u,{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timeout)}}
async function update(){if(updating)return;updating=true;$('update').disabled=true;$('update').textContent='更新中…';try{await Promise.allSettled([
(async()=>{try{renderNow(await get($('weatherUrl').value))}catch(e){$('weatherText').textContent='天氣連線失敗，請重試'}})(),
(async()=>{try{renderForecast(await get($('forecastUrl').value))}catch(e){$('forecast').innerHTML='<div class="muted">天氣預報暫時無法取得</div>'}})(),
(async()=>{try{const d=await get('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TML&sta=LOP&lang=TC');if(String(d.status)==='0')throw Error(d.message||'目前沒有列車資料');renderMtr(d);$('mtrStatus').textContent='港鐵更新：'+new Date().toLocaleTimeString('zh-HK',{hour12:false})}catch(e){$('mtrStatus').textContent='港鐵更新失敗（畫面可能為舊資料）：'+e.message}})(),updateKmb()
])}finally{updating=false;$('update').disabled=false;$('update').textContent='🔄 更新'}}
$('update').onclick=update;$('save').onclick=()=>{['weatherUrl','forecastUrl','trainCount','interval'].forEach(i=>localStorage.setItem(i,$(i).value));update();setTimer()};function setTimer(){clearInterval(timer);const n=Number($('interval').value);if(n)timer=setInterval(()=>{if(!document.hidden)update()},n)}$('theme').onclick=()=>{document.body.classList.toggle('dark');const d=document.body.classList.contains('dark');$('theme').textContent=d?'☀️ 淺色':'🌙 深色';localStorage.setItem('dark',d?'1':'0');document.querySelector('meta[name="theme-color"]').content=d?'#141923':'#fff6f8'};if(localStorage.getItem('dark')==='1')$('theme').click();['weatherUrl','forecastUrl'].forEach(i=>$(i).value=localStorage.getItem(i)||$(i).value);$('trainCount').value=localStorage.getItem('trainCount')||'3';$('interval').value=localStorage.getItem('interval')||'10000';update();setTimer();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)update()});
</script></body></html>
